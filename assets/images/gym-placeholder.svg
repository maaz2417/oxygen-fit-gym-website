<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="0%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <circle cx="400" cy="250" r="180" fill="#00F59B" opacity="0.08" filter="blur(60px)" />
  <circle cx="450" cy="320" r="140" fill="#00D2FF" opacity="0.08" filter="blur(60px)" />
  
  <!-- Gym Equipment Graphic -->
  <g transform="translate(250, 150)" stroke="url(#neonGlow)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 150 L 280 150" stroke-width="8" stroke="#374151" />
    <path d="M 80 150 L 220 150" stroke-width="10" stroke="url(#neonGlow)" />
    <rect x="50" y="80" width="16" height="140" rx="6" fill="#1F2937" stroke="url(#neonGlow)" stroke-width="3"/>
    <rect x="30" y="100" width="14" height="100" rx="4" fill="#111827" stroke="url(#neonGlow)" stroke-width="3"/>
    <rect x="15" y="120" width="10" height="60" rx="3" fill="#374151" stroke="#4B5563" stroke-width="2"/>
    <rect x="234" y="80" width="16" height="140" rx="6" fill="#1F2937" stroke="url(#neonGlow)" stroke-width="3"/>
    <rect x="256" y="100" width="14" height="100" rx="4" fill="#111827" stroke="url(#neonGlow)" stroke-width="3"/>
    <rect x="275" y="120" width="10" height="60" rx="3" fill="#374151" stroke="#4B5563" stroke-width="2"/>
  </g>
  
  <!-- Upload instructions banner -->
  <rect x="180" y="380" width="440" height="90" rx="12" fill="#1A2436" stroke="#253248" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">
    📸 Place Oxygen Fitness Club Photo Here
  </text>
  <text x="400" y="445" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="13" fill="#94A3B8">
    Save your photo as <tspan fill="#00F59B">assets/images/gym-hero.jpg</tspan>
  </text>
</svg>
