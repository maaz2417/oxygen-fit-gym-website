<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <defs>
    <linearGradient id="oxygenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>
  <!-- Oxygen Emblem: Dynamic Fitness Ring & Dumbbell -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="26" fill="none" stroke="url(#oxygenGrad)" stroke-width="6" stroke-dasharray="140 25" stroke-linecap="round"/>
    <path d="M 18 30 L 42 30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <rect x="14" y="21" width="4" height="18" rx="2" fill="url(#oxygenGrad)"/>
    <rect x="42" y="21" width="4" height="18" rx="2" fill="url(#oxygenGrad)"/>
    <circle cx="30" cy="30" r="3.5" fill="#00F59B"/>
  </g>
  
  <!-- Typography -->
  <text x="84" y="42" font-family="'Syne', 'Oswald', sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="#FFFFFF">
    OXYGEN<tspan fill="url(#oxygenGrad)">FITNESS</tspan>
  </text>
  <text x="86" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="4.5" fill="#94A3B8">
    CLUB
  </text>
</svg>
